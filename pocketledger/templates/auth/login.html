{% extends 'auth/layout.html' %}
{% block body %}
<form method="post" autocomplete="on" data-busy="Signing in…">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p class="muted center" style="margin-bottom:1.2rem">Sign in to your finances.</p>
  {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
  <div class="field"><label for="u">Username</label><input class="input" id="u" name="username" autocomplete="username" autocapitalize="none" required autofocus></div>
  <div class="field"><label for="p">Password</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" {% if config.MIN_PASSWORD_LENGTH %}required{% endif %}></div>
  <button class="btn primary block" type="submit">Sign in</button>
</form>
{% endblock %}
