<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1110">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Sign in{% endblock %} · PocketLedger</title>
  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=app_version) }}">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand"><img src="{{ url_for('static', filename='icons/icon-192.png') }}" alt="">PocketLedger</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</div>
</body>
</html>
